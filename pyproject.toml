[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "document-name-recovery"
version = "0.1.0"
description = "Safely propose and apply content-based filenames for recovered documents."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "pypdf>=5,<7",
  "python-dotenv>=1,<2",
]

[project.scripts]
doc-renamer = "doc_renamer.cli:main"

[tool.setuptools.packages.find]
include = ["doc_renamer*"]

